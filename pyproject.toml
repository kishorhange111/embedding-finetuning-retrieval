[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "embedtune"
version = "0.1.0"
description = "Fine-tuning a small embedding model for domain retrieval on BEIR FiQA: hard-negative mining, Matryoshka training, int8 and binary compression, measured against BM25 and the base model."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kishor Hange" }]
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.0,<4",
    "pyarrow>=14",
    "torch>=2.1,<3",
    "transformers>=4.45,<6",
    "sentence-transformers>=6,<7",
    "datasets>=3,<6",
    "accelerate>=0.30,<2",
    "huggingface-hub>=0.24",
    "bm25s>=0.2,<1",
    "PyStemmer>=2.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
embedtune-eval = "embedtune.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B905", "SIM105", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
