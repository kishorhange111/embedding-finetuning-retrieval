[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "embedtune"
version = "0.1.0"
description = "Fine-tuning a small embedding model for domain retrieval on BEIR FiQA: hard-negative mining, Matryoshka training, int8 and binary compression, measured against BM25 and the base model."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kishor Hange" }]
keywords = ["embeddings", "retrieval", "beir", "matryoshka", "quantization", "bm25", "rrf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.0,<4",
    "pyarrow>=14",
    "torch>=2.1,<3",
    "transformers>=4.45,<6",
    "sentence-transformers>=6,<7",
    "datasets>=3,<6",
    "accelerate>=0.30,<2",
    "huggingface-hub>=0.24",
    "bm25s>=0.2,<1",
    "PyStemmer>=2.2,<4",
]

[project.urls]
Homepage = "https://github.com/kishorhange111/embedding-finetuning-retrieval"
Repository = "https://github.com/kishorhange111/embedding-finetuning-retrieval"
Issues = "https://github.com/kishorhange111/embedding-finetuning-retrieval/issues"

[project.optional-dependencies]
serve = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.5,<3"]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
embedtune-eval = "embedtune.evaluate:main"
embedtune-serve = "embedtune.serve:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B905", "SIM105", "SIM108"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
